<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=block">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="assets/js/uk2.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Fredoka",sans-serif}
#cv{position:absolute;left:0;top:0;width:1080px;height:1920px}</style>
</head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
<canvas id="cv" class="clip" width="1080" height="1920" data-start="0" data-duration="15" data-track-index="1"></canvas>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const ctx = document.getElementById("cv").getContext("2d");
tl.to({}, { duration: 15, ease: "none", onUpdate: function () { UK2.draw(ctx, this.time()); } }, 0);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body></html>
