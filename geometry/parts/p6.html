*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05060a}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#05060a;color:#f1ebdd;font-family:"Archivo Black",sans-serif}
canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
#crt{image-rendering:pixelated}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px}
/* keyword text: heavy white sans, soft dark shadow, hard-on per word */
.kw{position:absolute;font-family:"Archivo Black";letter-spacing:-.5px;text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 24px rgba(0,0,0,.75)}
/* yellow section card */
.sec{position:absolute;left:0;right:0;text-align:center;font-family:"Archivo Black";font-size:68px;line-height:1.18;color:#e0b23a;opacity:0;text-shadow:0 0 20px rgba(0,0,0,.6)}
.sec div:first-child{font-size:60px}
/* mascot sub-heading */
.sub{position:absolute;font-family:"Archivo Black";text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 20px rgba(0,0,0,.7)}
.sub .h{font-size:78px;line-height:1.1}
.sub .b{font-size:54px;line-height:1.22;margin-top:12px}
/* mascot */
.mascot{position:absolute}
.mpose{position:absolute;inset:0}
.msvg{width:100%;height:100%;overflow:visible}
/* framed photo / screenshot */
.frame{position:absolute;overflow:hidden;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.frame.ss{background:#fff;border-radius:6px}
.ssin{position:absolute;inset:0}
.hl{position:absolute;border:6px solid #e0b23a;border-radius:6px;box-shadow:0 0 18px rgba(224,178,58,.35)}
.pshade{position:absolute;inset:0;background:#000}
/* pixel number box */
.numw{position:absolute}
.num{font-family:"Press Start 2P";padding:22px 30px 16px;border:5px solid;border-radius:14px;background:rgba(5,10,20,.85);white-space:nowrap;text-shadow:none}
.credit{position:absolute;left:40px;bottom:24px;font-family:"VT323";font-size:30px;color:rgba(255,255,255,.55)}
.vid{position:absolute;object-fit:cover}
.kw.dark span{background:rgba(6,8,16,.84);padding:.02em .22em .08em;border-radius:8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.scrim{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(4,6,14,.78) 0%,rgba(2,3,8,.95) 100%)}
.tag{position:absolute;padding:18px 34px 20px 26px;border-left:4px solid #e0b23a;background:rgba(10,12,16,.80);border-radius:0 6px 6px 0}
.tag .n{font-family:"Archivo Black";font-size:54px;line-height:1.05;color:#f1ebdd}
.tag .r{font-family:"Archivo";font-weight:600;font-size:31px;letter-spacing:.5px;color:#d9b25c;margin-top:8px}
.quote{position:absolute;background:#151b2b;border:2px solid #2b3550;border-radius:22px;padding:44px 56px 50px;box-shadow:0 30px 80px rgba(0,0,0,.75)}
.qhd{font-family:"Archivo Black";font-size:34px;color:#fff;margin-bottom:22px}
.qhd span{font-family:Arial,sans-serif;font-weight:400;font-size:28px;color:#8b98b8;margin-left:16px}
.qb{font-family:Arial,sans-serif;line-height:1.42;color:#dfe5f2}
.qh{color:#dfe5f2;background-image:linear-gradient(#e0b23a,#e0b23a);background-repeat:no-repeat;background-size:0% 100%;border-radius:4px;padding:0 4px}
/* EP4 documentary layer */
.chap{position:absolute;left:0;right:0;text-align:center;color:#f1ebdd;opacity:0}
.chap .no{font-family:"Archivo";font-weight:600;font-size:30px;letter-spacing:9px;color:rgba(241,235,221,.72)}
.chap .ti{font-family:"Archivo Black";font-size:84px;line-height:1.08;margin-top:20px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.chap .rule{height:3px;background:#e0b23a;margin:30px auto 0;width:0}
.chap .sci{font-family:"Playfair";font-style:italic;font-size:46px;color:#e3d6b8;margin-top:22px}
.place{position:absolute;left:110px;opacity:0;clip-path:inset(0 100% 0 0)}
.place .ru{width:70px;height:3px;background:#e0b23a;margin-bottom:16px}
.place .l1{font-family:"Archivo";font-weight:700;font-size:40px;letter-spacing:5px;color:#f1ebdd;text-shadow:0 2px 16px rgba(0,0,0,.8)}
.place .l2{font-family:"Archivo";font-weight:500;font-size:32px;letter-spacing:4px;color:#d9b25c;margin-top:8px;text-shadow:0 2px 16px rgba(0,0,0,.8)}
.refr{position:absolute;left:0;right:0;text-align:center}
.refr .a{font-family:"Archivo Black";font-size:62px;color:#8f969e}
.refr .a span{opacity:0;margin:0 .25em}
.refr .b{font-family:"Archivo Black";font-size:104px;color:#e0b23a;margin-top:14px;opacity:0;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.portrait{position:absolute;overflow:hidden;border:3px solid rgba(241,235,221,.85);box-shadow:0 24px 70px rgba(0,0,0,.75);background:#000}
.portrait img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(1.03)}
