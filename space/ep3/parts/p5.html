:root{--navy:#0a111d;--violet:#5d7398;--neon:#e4cd92;--pink:#d4826a;--orange:#d9a25f;--grey:#d9d6cf;--ring:#46505f;--ink:#eeebe4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:"Space Mono",monospace;color:var(--ink)}
canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
.navy{position:absolute;inset:0;background:var(--navy)}
.dust{position:absolute;left:-60px;top:-60px;width:2040px;height:1200px}
.vw{position:absolute;overflow:hidden}
.fit{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.fill{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover}
.black{position:absolute;inset:0;background:#000}
svg.full{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
/* chapter header: neon, condensed, top-left */
.hdr{position:absolute;left:64px;top:52px;font-family:"Anton";font-size:64px;line-height:1;letter-spacing:.5px;color:var(--neon);text-transform:uppercase;white-space:nowrap;opacity:0}
.hdr.c{left:0;right:0;text-align:center}
.hdr.r{left:auto;right:64px;text-align:right}
.shade{position:absolute;left:0;top:0;width:1920px;height:1080px;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.72) 100%)}
/* big number callout */
.num{position:absolute;display:flex;align-items:baseline;gap:18px;font-family:"Anton";color:var(--neon);text-transform:uppercase;white-space:nowrap;opacity:0}
.num b{font-weight:400;font-size:96px;line-height:1}
.num span{font-size:34px;letter-spacing:.5px}
/* statement line */
.stmt{position:absolute;text-shadow:0 2px 14px rgba(0,0,0,.55);left:0;right:0;text-align:center;font-family:"Anton";font-size:76px;line-height:1.05;color:var(--neon);text-transform:uppercase;opacity:0}
.stmt.w{color:var(--ink)}
/* mono labels */
.lab{position:absolute;font-family:"Space Mono";font-size:22px;letter-spacing:1.5px;color:var(--neon);text-transform:uppercase;white-space:nowrap}
.lab.w{color:var(--ink)}
.box{position:absolute;font-family:"Space Mono";font-size:21px;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;background:rgba(238,235,228,.92);color:#151a22;padding:3px 12px;opacity:0}
.box.v{background:var(--violet);color:#fff}
.box.p{background:var(--pink);color:#fff}
.lens{position:absolute;border-radius:50%;overflow:hidden;border:4px solid rgba(238,235,228,.9);background:#000;opacity:0}
.lens img,.lens video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.credit{position:absolute;right:40px;bottom:26px;font-family:"Space Mono";font-size:17px;letter-spacing:1px;color:rgba(255,255,255,.6);text-transform:uppercase}
.card{position:absolute;overflow:hidden;border:3px solid rgba(238,235,228,.9);opacity:0}
.card img,.card video{display:block;width:100%;height:100%;object-fit:cover}
.hid{display:none}

/* ---- v2 cinematic documentary ---- */
.navy{background:radial-gradient(ellipse at 50% 45%,#121110 0%,#080807 60%,#030303 100%)}
.card{border:none;box-shadow:0 30px 90px rgba(0,0,0,.65)}
.title{position:absolute;font-family:"EB Garamond",serif;font-weight:500;line-height:1.08;letter-spacing:.01em;color:#ece6da;text-shadow:0 2px 24px rgba(0,0,0,.75)}
.tcard{position:absolute;left:0;right:0;top:400px;text-align:center}
.tk{font-family:"Inter",sans-serif;font-weight:500;font-size:22px;letter-spacing:.42em;color:rgba(236,230,218,.82);padding-left:.42em}
.trule{width:120px;height:1px;background:rgba(236,230,218,.55);margin:26px auto 30px;transform-origin:50% 50%}
.tn{font-family:"EB Garamond",serif;font-weight:500;font-size:104px;line-height:1.05;color:#ece6da}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.grain{position:absolute;inset:0;background:url("assets/gen/grain.png") repeat;opacity:.55}
.lbx{position:absolute;left:0;width:1920px;height:104px;background:#000}
.lbx.top{top:0}.lbx.bot{bottom:0}
</style>
