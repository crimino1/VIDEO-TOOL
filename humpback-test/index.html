<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07202c; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07202c; font-family: "League Gothic", sans-serif; color: #f4f8f8; }
      #stage, #light, #vignette, #grain { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #light { background: radial-gradient(ellipse 1000px 620px at 34% 16%, rgba(150, 215, 225, 0.1), rgba(150, 215, 225, 0) 100%); }
      #vignette { background: radial-gradient(ellipse at center, rgba(2, 8, 12, 0) 52%, rgba(2, 8, 12, 0.62) 100%); }
      #grain { background-image: url(assets/grain.png); background-size: 512px 512px; opacity: 0.065; }
      .label { position: absolute; left: 192px; top: 112px; font-size: 44px; letter-spacing: 0.08em; color: #dff4f5; }
      #num { position: absolute; left: 192px; top: 160px; font-size: 132px; line-height: 1; font-variant-numeric: tabular-nums; }
      #swimLabel { position: absolute; left: 505px; top: 702px; font-size: 40px; letter-spacing: 0.05em; color: #f4f8f8; }
      #rowBig { position: absolute; right: 192px; top: 112px; font-size: 92px; line-height: 1; }
      #rowBig b { color: #ff5a3c; font-weight: 400; }
      #rowSmall { position: absolute; right: 192px; top: 212px; font-size: 38px; letter-spacing: 0.08em; color: #dff4f5; }
      #source { position: absolute; left: 210px; top: 990px; font-family: "Inter", sans-serif; font-size: 28px; color: #9fc0c6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1920" data-height="1080">
      <svg id="stage" viewBox="0 0 19.2 10.8" data-layout-allow-overflow data-layout-allow-overlap data-layout-ignore>
        <defs>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2f5a6e" />
            <stop offset="0.55" stop-color="#1f4254" />
            <stop offset="1" stop-color="#173443" />
          </linearGradient>
          <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8fabb1" />
            <stop offset="1" stop-color="#d4e1e0" />
          </linearGradient>
          <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#5f8390" />
            <stop offset="1" stop-color="#d9e5e3" />
          </linearGradient>
          <clipPath id="rulerClip"><rect id="rulerClipRect" x="1.9" y="9.0" width="0" height="1" /></clipPath>
          <clipPath id="lastClip"><rect x="16.1" y="8" width="1" height="2" /></clipPath>
          <!-- One swimmer for the row: feet at x=0, top of head at x=1.75, exactly 1.75 m -->
          <g id="man">
            <path d="M.82 -.1 L.02 -.085 A.02 .02 0 0 0 .02 -.045 L.88 .02 Z" />
            <path d="M.82 .1 L.02 .085 A.02 .02 0 0 1 .02 .045 L.88 -.02 Z" />
            <path d="M.78 -.105 C1.05 -.11 1.25 -.12 1.4 -.135 Q1.51 -.12 1.5 -.03 Q1.5 .09 1.4 .135 C1.25 .12 1.05 .11 .78 .105 Z" />
            <path d="M1.46 -.05 L1.58 -.05 L1.58 .05 L1.46 .05 Z" />
            <circle cx="1.635" cy="0" r=".115" />
          </g>
        </defs>

        <g id="grid" stroke="#7fd0d4" stroke-opacity=".075" fill="none"></g>
        <g id="snow" fill="#cfeef0"></g>

        <g id="whale">
          <path id="flukeFar" d="M-.1 -.05 C.3 -.2 .75 -.42 1.2 -.6 C1.14 -.38 1.06 -.18 .95 0 L0 .1 Z" fill="#132c3a" stroke="#8fe0e0" stroke-opacity=".3" stroke-width=".025" />
          <path id="flukeNear" d="M-.1 0 L.95 0 C1.06 .24 1.14 .5 1.2 .78 C.78 .62 .32 .34 -.1 .12 Z" fill="#2a5165" stroke="#8fe0e0" stroke-opacity=".45" stroke-width=".03" />
          <path id="body" fill="url(#bodyGrad)" stroke="#8fe0e0" stroke-opacity=".5" stroke-width=".035" />
          <path id="belly" fill="url(#bellyGrad)" />
          <path id="pleats" fill="none" stroke="#3f6270" stroke-opacity=".75" stroke-width=".03" stroke-linecap="round" />
          <path id="mouth" fill="none" stroke="#0a1c26" stroke-width=".05" stroke-linecap="round" />
          <g id="knobs" fill="#58808f"></g>
          <circle id="eyeRing" r=".13" fill="#3f6270" />
          <circle id="eye" r=".075" fill="#04121a" />
          <!-- Flipper: 4.6 m, about a third of the body. Knobs run along the leading edge. -->
          <path id="flipper" fill="url(#finGrad)" stroke="#e8f2f0" stroke-opacity=".55" stroke-width=".03"
            d="M.05 -.3 C.7 -.52 2.2 -.58 3.5 -.34 C4.1 -.22 4.5 -.1 4.6 .02 C4.55 .16 4.4 .24 4.2 .3 Q4.05 .24 3.9 .34 Q3.7 .3 3.5 .42 Q3.25 .38 3.05 .5 Q2.75 .46 2.5 .58 Q2.2 .54 1.95 .64 Q1.6 .6 1.3 .62 Q.8 .56 .05 .3 Q-.22 0 .05 -.3 Z" />
        </g>

        <g id="swimmer" stroke-linecap="round" fill="none">
          <path id="farThigh" fill="#a9a497" />
          <path id="farShin" fill="#a9a497" />
          <path id="farFoot" fill="#a9a497" />
          <path id="farArm" fill="#a9a497" />
          <path id="torso" fill="#efeadc" stroke="none" d="M.8 -.11 C1.05 -.12 1.25 -.13 1.4 -.15 Q1.54 -.13 1.53 -.03 Q1.52 .08 1.42 .12 C1.25 .13 1.05 .1 .8 .115 Q.72 0 .8 -.11 Z" />
          <path id="nearThigh" fill="#efeadc" />
          <path id="nearShin" fill="#efeadc" />
          <path id="nearFoot" fill="#efeadc" />
          <path id="trunks" fill="#ff5a3c" stroke="none" d="M.74 -.112 L1.02 -.118 L1.02 .108 L.74 .118 Z" />
          <path id="nearTrunkLeg" fill="#ff5a3c" />
          <path id="neck" stroke="#efeadc" stroke-width=".1" d="M1.46 -.01 L1.58 -.01" />
          <circle cx="1.635" cy="-.01" r=".115" fill="#efeadc" stroke="none" />
          <path id="cap" fill="#ff5a3c" stroke="none" d="M1.62 -.125 A.115 .115 0 0 1 1.75 -.01 A.115 .115 0 0 1 1.62 .105 Q1.6 -.01 1.62 -.125 Z" />
          <path id="goggle" stroke="#07202c" stroke-width=".035" d="M1.62 .09 L1.68 .075" />
          <path id="nearArm" fill="#efeadc" />
        </g>

        <g id="row">
          <use id="u1" href="#man" x="2.1" y="8.92" fill="#f4f8f8" opacity="0" />
          <use id="u2" href="#man" x="3.85" y="8.92" fill="#ff5a3c" opacity="0" />
          <use id="u3" href="#man" x="5.6" y="8.92" fill="#f4f8f8" opacity="0" />
          <use id="u4" href="#man" x="7.35" y="8.92" fill="#ff5a3c" opacity="0" />
          <use id="u5" href="#man" x="9.1" y="8.92" fill="#f4f8f8" opacity="0" />
          <use id="u6" href="#man" x="10.85" y="8.92" fill="#ff5a3c" opacity="0" />
          <use id="u7" href="#man" x="12.6" y="8.92" fill="#f4f8f8" opacity="0" />
          <use id="u8" href="#man" x="14.35" y="8.92" fill="#ff5a3c" opacity="0" />
          <g clip-path="url(#lastClip)"><use id="u9" href="#man" x="16.1" y="8.92" fill="#f4f8f8" opacity="0" /></g>
        </g>

        <g id="drops" stroke="#dff4f5" stroke-opacity=".55" stroke-width=".02" stroke-dasharray=".1 .08">
          <line id="dropNose" x1="2.1" x2="2.1" y1="4.5" y2="9.28" />
          <line id="dropTail" x1="17.1" x2="17.1" y1="4.6" y2="9.28" />
        </g>
        <g id="ruler" clip-path="url(#rulerClip)">
          <path id="rulerLine" stroke="#f4f8f8" stroke-width=".03" fill="none"></path>
          <g font-family="League Gothic" font-size=".28" fill="#f4f8f8" text-anchor="middle">
            <text x="2.1" y="9.66">0</text>
            <text x="7.1" y="9.66">5 M</text>
            <text x="12.1" y="9.66">10 M</text>
            <text x="17.1" y="9.66">15 M</text>
          </g>
        </g>
      </svg>

      <div id="light"></div>
      <div id="vignette"></div>
      <div id="grain"></div>

      <div id="lbl1" class="label clip" data-start="0" data-duration="6.3" data-track-index="1"><span id="lbl1i">ONE SWIMMER</span></div>
      <div id="lbl2" class="label clip" data-start="6.3" data-duration="6.7" data-track-index="1"><span id="lbl2i">ONE HUMPBACK WHALE</span></div>
      <div id="num" class="clip" data-start="0" data-duration="13" data-track-index="2"><span id="numi">1.75 M</span></div>
      <div id="swimLabel" class="clip" data-start="6.4" data-duration="6.6" data-track-index="3"><span id="swimLabeli">SWIMMER, 1.75 M</span></div>
      <div id="rowBig" class="clip" data-start="9.2" data-duration="3.8" data-track-index="4"><span id="rowBigi"><b>8½</b> SWIMMERS</span></div>
      <div id="rowSmall" class="clip" data-start="9.5" data-duration="3.5" data-track-index="6"><span id="rowSmalli">NOSE TO TAIL</span></div>
      <div id="source" class="clip" data-start="6.6" data-duration="6.4" data-track-index="5"><span id="sourcei">Whale: adult female average, 49 ft (US NPS). Swimmer: 1.75 m, assumed.</span></div>
    </div>

    <script>
      // Everything is in metres. The camera only changes the viewBox, so sizes can't drift apart.
      const DUR = 13, WHALE_X = 2.1, WHALE_Y = 4.4;
      const $ = (id) => document.getElementById(id);
      const clamp01 = (v) => Math.min(1, Math.max(0, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const camEase = gsap.parseEase("power2.inOut");
      const glideEase = gsap.parseEase("power1.out");
      const countEase = gsap.parseEase("power2.out");
      const rulerEase = gsap.parseEase("power2.inOut");
      const rnd = (seed) => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };

      // Smooth curve through [x, y] samples
      const curve = (pts) => (x) => {
        if (x <= pts[0][0]) return pts[0][1];
        const n = pts.length;
        if (x >= pts[n - 1][0]) return pts[n - 1][1];
        let i = 0;
        while (pts[i + 1][0] < x) i++;
        const slope = (j) => { const a = pts[Math.max(j - 1, 0)], b = pts[Math.min(j + 1, n - 1)]; return (b[1] - a[1]) / (b[0] - a[0]); };
        const h = pts[i + 1][0] - pts[i][0], u = (x - pts[i][0]) / h, u2 = u * u, u3 = u2 * u;
        return (2 * u3 - 3 * u2 + 1) * pts[i][1] + (u3 - 2 * u2 + u) * h * slope(i) + (-2 * u3 + 3 * u2) * pts[i + 1][1] + (u3 - u2) * h * slope(i + 1);
      };
      const topEdge = curve([[0, -0.02], [0.08, -0.17], [0.6, -0.42], [1.5, -0.72], [3, -1.08], [4.5, -1.32], [6, -1.46], [7.5, -1.5], [9, -1.42], [9.35, -1.42], [9.7, -1.66], [9.95, -1.7], [10.15, -1.44], [10.6, -1.16], [11.5, -0.86], [12.5, -0.54], [13.6, -0.27], [14, -0.19], [14.35, -0.02]]);
      const bottom = curve([[0, 0.02], [0.08, 0.15], [0.6, 0.48], [1.5, 1.0], [3, 1.5], [4.5, 1.76], [6, 1.76], [7.5, 1.55], [9, 1.2], [11, 0.75], [12.5, 0.42], [13.6, 0.24], [14, 0.17], [14.35, 0.02]]);
      const mouth = curve([[0, 0], [1.2, -0.06], [2.4, -0.05], [3.2, 0.1], [3.85, 0.42]]);

      // Slow swimming wave: strongest at the tail, almost nothing at the head.
      const wave = (x, t) => (0.015 + 0.5 * Math.pow(x / 15, 3)) * Math.sin(2 * Math.PI * (x / 19 - t / 3.4));
      const glide = (t) => 11 * (1 - glideEase(clamp01((t - 2.6) / 4.4)));
      const line = (pts) => "M" + pts.map((p) => p[0].toFixed(3) + " " + p[1].toFixed(3)).join("L");

      function drawWhale(t) {
        const ox = WHALE_X + glide(t);
        const P = (x, y) => [ox + x, WHALE_Y + y + wave(x, t)];
        const xs = []; for (let x = 0; x <= 14.35; x += 0.05) xs.push(x);
        xs.push(14.35);
        $("body").setAttribute("d", line([...xs.map((x) => P(x, topEdge(x))), ...xs.slice().reverse().map((x) => P(x, bottom(x)))]) + "Z");

        // Pale throat and belly, tapering out near the dorsal fin
        const bellyTop = (x) => x < 3.85 ? mouth(x) : lerp(mouth(3.85), bottom(9.2), Math.pow((x - 3.85) / 5.35, 0.8));
        const bx = xs.filter((x) => x <= 9.2);
        $("belly").setAttribute("d", line([...bx.map((x) => P(x, bellyTop(x))), ...bx.slice().reverse().map((x) => P(x, bottom(x)))]) + "Z");
        let d = "";
        for (let f = 0.18; f < 0.95; f += 0.11) {
          const px = xs.filter((x) => x >= 0.5 && x <= 8.6 - 0.8 * f);
          d += line(px.map((x) => P(x, lerp(bellyTop(x), bottom(x), f))));
        }
        $("pleats").setAttribute("d", d);
        $("mouth").setAttribute("d", line(xs.filter((x) => x <= 3.85).map((x) => P(x, mouth(x)))));

        const [ex, ey] = P(4.1, 0.2);
        for (const id of ["eyeRing", "eye"]) { $(id).setAttribute("cx", ex); $(id).setAttribute("cy", ey); }
        for (const k of knobEls) { const [kx, ky] = P(k.x, k.y); k.el.setAttribute("cx", kx); k.el.setAttribute("cy", ky); }

        // Flukes pitch with the slope of the tail
        const [fx, fy] = P(13.8, 0);
        const slope = (wave(13.9, t) - wave(13.6, t)) / 0.3;
        const fa = (Math.atan(slope) * 180) / Math.PI * 1.6;
        for (const id of ["flukeFar", "flukeNear"]) $(id).setAttribute("transform", `translate(${fx.toFixed(3)} ${fy.toFixed(3)}) rotate(${fa.toFixed(2)})`);

        const [rx, ry] = P(4.9, 1.15);
        const finA = 35 + 3.5 * Math.sin((2 * Math.PI * t) / 3.4 + 0.8);
        $("flipper").setAttribute("transform", `translate(${rx.toFixed(3)} ${ry.toFixed(3)}) rotate(${finA.toFixed(2)})`);
      }

      // Swimmer: feet at x=0, top of head at x=1.75
      function limb(x, y, parts) {
        const pts = [[x, y]]; let a = 0;
        for (const [len, ang] of parts) { a += ang; x += len * Math.cos(a); y += len * Math.sin(a); pts.push([x, y]); }
        return pts;
      }
      function capsule(a, b, r0, r1) {
        const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1e-6, nx = -dy / L, ny = dx / L;
        const f = (v) => v.toFixed(4);
        return `M${f(a[0] + nx * r0)} ${f(a[1] + ny * r0)}L${f(b[0] + nx * r1)} ${f(b[1] + ny * r1)}A${r1} ${r1} 0 0 0 ${f(b[0] - nx * r1)} ${f(b[1] - ny * r1)}L${f(a[0] - nx * r0)} ${f(a[1] - ny * r0)}A${r0} ${r0} 0 0 0 ${f(a[0] + nx * r0)} ${f(a[1] + ny * r0)}Z`;
      }
      function drawSwimmer(t) {
        const bob = 0.012 * Math.sin((2 * Math.PI * t) / 0.9);
        $("swimmer").setAttribute("transform", `translate(2.6 ${(7.25 + bob).toFixed(4)}) rotate(-2 .9 0)`);
        const legs = (phase) => {
          const k = (2 * Math.PI * t) / 0.62 + phase;
          return limb(0.9, 0, [[0.42, Math.PI + 0.14 * Math.sin(k)], [0.36, -0.2 * (1 + Math.sin(k - 1.1)) / 2], [0.1, -0.12]]);
        };
        const near = legs(0), far = legs(Math.PI);
        const paint = (id, p) => {
          $(id + "Thigh").setAttribute("d", capsule(p[0], p[1], 0.085, 0.058));
          $(id + "Shin").setAttribute("d", capsule(p[1], p[2], 0.058, 0.034));
          $(id + "Foot").setAttribute("d", capsule(p[2], p[3], 0.034, 0.02));
        };
        paint("near", near); paint("far", far);
        const trunkEnd = [near[0][0] + (near[1][0] - near[0][0]) * 0.4, near[0][1] + (near[1][1] - near[0][1]) * 0.4];
        const tx = near[1][0] - near[0][0], ty = near[1][1] - near[0][1], tl_ = Math.hypot(tx, ty), nx = -ty / tl_, ny = tx / tl_;
        $("nearTrunkLeg").setAttribute("d", line([[near[0][0] + nx * 0.092, near[0][1] + ny * 0.092], [trunkEnd[0] + nx * 0.074, trunkEnd[1] + ny * 0.074], [trunkEnd[0] - nx * 0.074, trunkEnd[1] - ny * 0.074], [near[0][0] - nx * 0.092, near[0][1] - ny * 0.092]]) + "Z");
        // Front crawl: reach, pull under the body, recover over the top
        const arm = (phase) => {
          const a = (2 * Math.PI * t) / 1.9 + phase;
          const recovery = Math.max(0, -Math.sin(a)), pull = Math.max(0, Math.sin(a));
          const p = limb(1.42, -0.02, [[0.3, a], [0.28, -0.75 * pull + 1.35 * recovery], [0.12, 0.08]]);
          return capsule(p[0], p[1], 0.052, 0.04) + capsule(p[1], p[2], 0.04, 0.03) + capsule(p[2], p[3], 0.03, 0.02);
        };
        $("nearArm").setAttribute("d", arm(0));
        $("farArm").setAttribute("d", arm(Math.PI));
      }

      function drawCamera(t) {
        const k = camEase(clamp01((t - 3) / 3.2));
        const w0 = 4.2, w1 = 19.2, w = Math.exp(lerp(Math.log(w0), Math.log(w1), k));
        const m = (w - w0) / (w1 - w0);
        const cx = lerp(3.5, 9.6, m), cy = lerp(7.25, 5.4, m), h = (w * 9) / 16;
        $("stage").setAttribute("viewBox", `${(cx - w / 2).toFixed(4)} ${(cy - h / 2).toFixed(4)} ${w.toFixed(4)} ${h.toFixed(4)}`);
      }

      function drawRuler(t) {
        const k = rulerEase(clamp01((t - 6.6) / 1.4));
        $("rulerClipRect").setAttribute("width", (k > 0 ? 0.2 + 15.3 * k : 0).toFixed(3));
        const op = clamp01((t - 6.4) / 0.4);
        $("drops").setAttribute("opacity", op.toFixed(3));
      }

      function drawNumber(t) {
        const k = countEase(clamp01((t - 6.6) / 1.4));
        $("numi").textContent = k <= 0 ? "1.75 M" : k >= 1 ? "15 M" : lerp(1.75, 15, k).toFixed(1) + " M";
      }

      function drawSnow(t) {
        for (const s of snowEls) {
          s.el.setAttribute("cx", (((s.x - 0.07 * t * s.v + 30) % 30) - 5).toFixed(3));
          s.el.setAttribute("cy", (s.y + 0.12 * Math.sin(t * 0.5 + s.p) + 0.03 * t).toFixed(3));
        }
      }

      function draw(t) { drawCamera(t); drawWhale(t); drawSwimmer(t); drawRuler(t); drawNumber(t); drawSnow(t); }

      // Static pieces built once
      const SVGNS = "http://www.w3.org/2000/svg";
      const mk = (parent, tag, attrs) => { const e = document.createElementNS(SVGNS, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); parent.appendChild(e); return e; };
      let gridD = "";
      for (let x = -6; x <= 26; x++) gridD += `M${x} -4V16`;
      for (let y = -4; y <= 16; y++) gridD += `M-6 ${y}H26`;
      mk($("grid"), "path", { d: gridD, "vector-effect": "non-scaling-stroke", "stroke-width": 1 });
      let rulerD = "M2.1 9.3H17.1";
      for (let m = 0; m <= 15; m++) rulerD += `M${2.1 + m} 9.3V${m % 5 === 0 ? 9.44 : 9.37}`;
      $("rulerLine").setAttribute("d", rulerD);
      // Barnacle-like knobs on the head, a humpback's giveaway
      const rk = rnd(7), knobEls = [];
      for (let i = 0; i < 46; i++) {
        const x = 0.25 + rk() * 3.2, onTop = rk() < 0.62;
        const y = onTop ? lerp(topEdge(x) + 0.06, mouth(x) - 0.05, rk() * 0.75) : lerp(mouth(x) + 0.06, bottom(x) - 0.05, rk() * 0.35);
        knobEls.push({ x, y, el: mk($("knobs"), "circle", { r: (0.035 + rk() * 0.035).toFixed(3) }) });
      }
      const rs = rnd(31), snowEls = [];
      for (let i = 0; i < 150; i++) {
        const near = i < 45; // extra flecks around the swimmer for the close-up
        const x = near ? 5 + 1.3 + rs() * 4.6 : rs() * 30, y = near ? 5.8 + rs() * 2.9 : rs() * 12 - 0.5;
        snowEls.push({ x, y, v: 0.5 + rs(), p: rs() * 6, el: mk($("snow"), "circle", { r: (near ? 0.004 + rs() * 0.008 : 0.008 + rs() * 0.014).toFixed(3), opacity: (0.12 + rs() * 0.38).toFixed(2) }) });
      }

      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(state.t) }, 0);

      // Text lands, then holds still
      const blurIn = (sel, at, dur = 0.2) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: dur, ease: "power2.out" }, at);
      blurIn("#lbl1i", 0.2);
      blurIn("#numi", 0.3);
      tl.to("#lbl1i", { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in" }, 6.08);
      blurIn("#lbl2i", 6.35);
      blurIn("#swimLabeli", 6.5);
      blurIn("#sourcei", 6.7);
      blurIn("#rowBigi", 9.25);
      blurIn("#rowSmalli", 9.55);
      for (let i = 1; i <= 9; i++) tl.fromTo("#u" + i, { opacity: 0 }, { opacity: i % 2 ? 0.95 : 0.9, duration: 0.14, ease: "power2.out" }, 9.3 + (i - 1) * 0.13);

      for (const id of ["u1", "u2", "u3", "u4", "u5", "u6", "u7", "u8", "u9"]) $(id).setAttribute("opacity", 0);
      draw(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
